<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Rain | YEONRI PLAYLIST ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --panel:#09060c;
  --line:#2d1b36;
  --purple:#c98be8;
  --purple-dim:#765383;
  --text:#eee6f2;
  --sub:#807487;
  --system:"Share Tech Mono",Consolas,monospace;
  --ko:"Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 25% 20%,rgba(94,39,120,.13),transparent 30%),
    #000;
  color:var(--text);
  font-family:"Share Tech Mono",Consolas,monospace;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
.page{
  width:min(calc(100% - 34px),1120px);
  margin:auto;
  padding:32px 0 70px;
}
.top,
.header small,
.header h1,
.back{
  font-family:var(--system);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
  color:#66536e;
  font-size:10px;
  letter-spacing:1px;
}
.back:hover{color:var(--purple)}
.header{
  padding:52px 0 36px;
}
.header small{
  color:#674d70;
  letter-spacing:1.2px;
}
.header h1{
  margin:12px 0 0;
  color:#e2bdf4;
  font-size:clamp(34px,6vw,58px);
  font-weight:400;
  letter-spacing:3px;
}
.player{
  display:grid;
  grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr);
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(14,9,18,.96),rgba(3,2,5,.99));
}
.left{
  min-width:0;
  padding:38px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-right:1px solid var(--line);
}
.turntable{
  position:relative;
  width:min(100%,370px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
}
.disc{
  position:relative;
  width:88%;
  aspect-ratio:1;
  border-radius:50%;
  padding:5%;
  background:
    repeating-radial-gradient(circle,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),
    #050406;
  box-shadow:0 0 0 1px #24182a,0 18px 50px rgba(0,0,0,.5);
}
.cover{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  filter:saturate(.78) brightness(.82);
  transform-origin:50% 50%;
  will-change:transform;
}
.cover.spinning{
  animation:recordSpin 10s linear infinite;
}
@keyframes recordSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.center-hole{
  position:absolute;
  left:50%;
  top:50%;
  width:14px;
  height:14px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#08060a;
  border:2px solid #9d6cb0;
}
.now{
  width:100%;
  margin-top:28px;
}
.now-label{
  color:#654d6d;
  font-size:9px;
  letter-spacing:1.1px;
}
.now-title{
  margin-top:8px;
  font-size:17px;
  color:#e2d5e7;
}
.now-artist{
  margin-top:5px;
  color:#837389;
  font-size:11px;
}
.progress-wrap{
  margin-top:22px;
}
.progress{
  width:100%;
  accent-color:#9b66af;
}
.time{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
  color:#5f5065;
  font-size:8px;
}
.controls{
  margin-top:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.controls button{
  width:44px;
  height:38px;
  border:1px solid #382340;
  background:#070509;
  color:#866192;
  cursor:pointer;
}
.controls button:hover{
  border-color:#734780;
  color:#d39bec;
}
.play-btn{
  width:54px!important;
  color:#d39bec!important;
}
.right{
  min-width:0;
  padding:26px 22px 30px;
}
.list-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:0 7px 16px;
  border-bottom:1px solid #26192c;
  color:#674f70;
  font-size:9px;
  letter-spacing:1px;
}
.track-list{
  display:flex;
  flex-direction:column;
}
.track{
  position:relative;
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  width:100%;
  padding:14px 8px;
  border:0;
  border-bottom:1px solid #1c1320;
  background:transparent;
  color:inherit;
  text-align:left;
  cursor:pointer;
}
.track:hover{background:rgba(108,54,126,.06)}
.track.active{
  background:linear-gradient(90deg,rgba(120,65,141,.14),transparent);
}
.track.active::before{
  content:"";
  position:absolute;
  left:0;
  top:10px;
  bottom:10px;
  width:2px;
  background:#b776cf;
}
.num{
  color:#55415b;
  font-size:9px;
}
.track.active .num{color:#bd83d0}
.track-title{
  color:#cfc1d4;
  font-size:12px;
}
.track.active .track-title{color:#e6c9f2}
.track-artist{
  margin-top:4px;
  color:#6d616f;
  font-size:9px;
}
.state{
  color:#473a4b;
  font-size:8px;
  letter-spacing:.8px;
}
.track.active .state{color:#a874ba}
.equalizer{
  display:none;
  gap:2px;
  align-items:flex-end;
  height:13px;
}
.track.active .equalizer{display:flex}
.bar{
  width:2px;
  background:#ad77c1;
  animation:eq .65s ease-in-out infinite alternate;
}
.bar:nth-child(1){height:5px}
.bar:nth-child(2){height:11px;animation-delay:.18s}
.bar:nth-child(3){height:7px;animation-delay:.34s}
.paused .bar{animation-play-state:paused}
@keyframes eq{to{height:3px}}
.notice{
  margin-top:18px;
  color:#55475a;
  font-size:9px;
  line-height:1.7;
}
@media(max-width:760px){
  .player{grid-template-columns:1fr}
  .left{
    padding:28px 22px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .turntable{width:min(82vw,320px)}
  .right{padding:20px 14px 24px}
}
@media(prefers-reduced-motion:reduce){
  .cover.spinning{animation-duration:24s}
  .bar{animation:none}
}
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <span>STAR RAIN / AUDIO ARCHIVE</span>
    <a class="back" href="yeonri.html">&lt; RETURN TO SUBJECT</a>
  </div>

  <header class="header">
    <small>ROOT / DATABASE / 結(決) / PLAYLIST</small>
    <h1>PLAYLIST</h1>
  </header>

  <section class="player">
    <div class="left">
      <div class="turntable">
        <div class="disc" id="disc">
          <img class="cover" id="cover" src="yeonri-playlist-cover.png" alt="현재 재생 이미지">
          <span class="center-hole"></span>
        </div>
      </div>

      <div class="now">
        <div class="now-label">NOW PLAYING</div>
        <div class="now-title" id="nowTitle">TRACK 01</div>
        <div class="now-artist" id="nowArtist">ARTIST</div>

        <div class="progress-wrap">
          <input class="progress" id="progress" type="range" min="0" max="100" value="0" aria-label="재생 위치">
          <div class="time">
            <span id="currentTime">00:00</span>
            <span id="duration">00:00</span>
          </div>
        </div>

        <div class="controls">
          <button type="button" id="prev" aria-label="이전 곡">◀◀</button>
          <button type="button" class="play-btn" id="play" aria-label="재생">▶</button>
          <button type="button" id="next" aria-label="다음 곡">▶▶</button>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="list-head">
        <span>INDEXED AUDIO RECORDS</span>
        <span id="trackCount"></span>
      </div>
      <div class="track-list" id="trackList"></div>

      <p class="notice">
        YOUTUBE LINKED AUDIO / SELECTED TRACK CONTINUES TO THE NEXT RECORD AUTOMATICALLY.
      </p>
    </div>
  </section>

  <div id="youtubePlayer" aria-hidden="true" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
</main>

<script>
const tracks = [
  {
    title: "Stellar Stellar",
    artist: "星街すいせい",
    youtube: "https://youtu.be/a51VH9BYzZA?si=23reSjtvODXGv8Ay",
    cover: "yeonri-playlist-cover.png"
  },
  {
    title: "「アドベンチャー」",
    artist: "YOASOBI",
    youtube: "https://youtu.be/Av3xaZkVpJs?si=DJ6TwsNQeOVB1uQl",
    cover: "yeonri-playlist-cover1.png"
  },
  {
    title: "私は最強",
    artist: "Ado",
    youtube: "https://youtu.be/sk1Z-Hqwwog?si=JvA5MoZMl8qxE1Ax",
    cover: "yeonri-playlist-cover2.png"
  },
  {
    title: "心予報",
    artist: "Eve",
    youtube: "https://youtu.be/Qd1MRTRpNSo?si=2J9MetV5nKJDMejT",
    cover: "yeonri-playlist-cover3.png"
  },
  {
    title: "LADY",
    artist: "米津玄師",
    youtube: "https://youtu.be/nExKn5ed03E?si=XqBaspMsNc6bJW3K",
    cover: "yeonri-playlist-cover4.png"
  },
  {
    title: "T.B.H(고민중독)",
    artist: "QWER",
    youtube: "https://youtu.be/hFTs6HbtxbE?si=PUV0GymHvrUrRT4x",
    cover: "yeonri-playlist-cover5.png"
  },
  {
    title: "向日葵",
    artist: "Ado",
    youtube: "https://youtu.be/aOKa-5AHCtU?si=dk_osgXn01-41GHs",
    cover: "yeonri-playlist-cover6.png"
  },
  {
    title: "JANE DOE",
    artist: "米津玄師, 宇多田ヒカル",
    youtube: "https://youtu.be/sPLqsLsooJY?si=teSU6GcXXOoC3_gA",
    cover: "yeonri-playlist-cover8.png"
  }
];

const disc = document.getElementById("disc");
const cover = document.getElementById("cover");
const nowTitle = document.getElementById("nowTitle");
const nowArtist = document.getElementById("nowArtist");
const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const progress = document.getElementById("progress");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");
const trackList = document.getElementById("trackList");
const trackCount = document.getElementById("trackCount");

let player = null;
let current = 0;
let playerReady = false;
let progressTimer = null;
let pendingAutoplay = false;

function extractYouTubeId(url){
  if(!url) return "";
  const text = String(url).trim();

  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/watch\?[^#]*v=([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/
  ];

  for(const pattern of patterns){
    const match = text.match(pattern);
    if(match) return match[1];
  }

  return text;
}

function formatTime(sec){
  if(!Number.isFinite(sec) || sec < 0) return "00:00";
  const m = Math.floor(sec / 60);
  const ss = Math.floor(sec % 60);
  return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`;
}

function renderList(){
  trackList.innerHTML = "";
  trackCount.textContent = `${String(tracks.length).padStart(2,"0")} TRACKS`;

  tracks.forEach((track,index)=>{
    const button = document.createElement("button");
    button.type = "button";
    button.className = "track" + (index === current ? " active" : "");
    button.innerHTML = `
      <span class="num">${String(index + 1).padStart(2,"0")}</span>
      <span>
        <span class="track-title">${track.title}</span>
        <span class="track-artist">${track.artist}</span>
      </span>
      <span class="state">
        <span class="equalizer">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </span>
      </span>
    `;
    button.addEventListener("click",()=>{
      loadTrack(index,true);
    });
    trackList.appendChild(button);
  });

  updatePlayingState();
}

function loadTrack(index, autoplay=false){
  current = (index + tracks.length) % tracks.length;
  const track = tracks[current];

  cover.src = track.cover;
  cover.alt = `${track.title} cover`;
  nowTitle.textContent = track.title;
  nowArtist.textContent = track.artist;
  progress.value = 0;
  currentTimeEl.textContent = "00:00";
  durationEl.textContent = "00:00";
  renderList();

  const videoId = extractYouTubeId(track.youtube);
  pendingAutoplay = autoplay;

  if(playerReady && player && videoId){
    if(autoplay){
      player.loadVideoById(videoId);
    }else{
      player.cueVideoById(videoId);
    }
  }
}

function updatePlayingState(){
  let playing = false;

  if(playerReady && player && typeof player.getPlayerState === "function"){
    playing = player.getPlayerState() === YT.PlayerState.PLAYING;
  }

  cover.classList.toggle("spinning",playing);
  disc.classList.toggle("playing",playing);
  playBtn.textContent = playing ? "Ⅱ" : "▶";
  playBtn.setAttribute("aria-label",playing ? "일시정지" : "재생");

  document.querySelectorAll(".track").forEach((el,index)=>{
    const eq = el.querySelector(".equalizer");
    if(eq) eq.classList.toggle("paused",!playing);
    el.classList.toggle("active",index === current);
  });
}

function updateProgress(){
  if(!playerReady || !player) return;

  const currentTime = Number(player.getCurrentTime?.() || 0);
  const duration = Number(player.getDuration?.() || 0);

  currentTimeEl.textContent = formatTime(currentTime);
  durationEl.textContent = formatTime(duration);

  if(duration > 0){
    progress.value = Math.min(100, Math.max(0, currentTime / duration * 100));
  }
}

function startProgressTimer(){
  stopProgressTimer();
  progressTimer = window.setInterval(updateProgress,500);
}

function stopProgressTimer(){
  if(progressTimer){
    clearInterval(progressTimer);
    progressTimer = null;
  }
}

playBtn.addEventListener("click",()=>{
  if(!playerReady || !player) return;

  const state = player.getPlayerState();

  if(state === YT.PlayerState.PLAYING){
    player.pauseVideo();
  }else{
    player.playVideo();
  }
});

prevBtn.addEventListener("click",()=>loadTrack(current - 1,true));
nextBtn.addEventListener("click",()=>loadTrack(current + 1,true));

progress.addEventListener("input",()=>{
  if(!playerReady || !player) return;

  const duration = Number(player.getDuration?.() || 0);

  if(duration > 0){
    const target = duration * (Number(progress.value) / 100);
    player.seekTo(target,true);
    updateProgress();
  }
});

function onYouTubeIframeAPIReady(){
  const firstVideoId = extractYouTubeId(tracks[0]?.youtube || "");

  player = new YT.Player("youtubePlayer",{
    width:"1",
    height:"1",
    videoId:firstVideoId,
    playerVars:{
      controls:0,
      disablekb:1,
      fs:0,
      modestbranding:1,
      playsinline:1,
      rel:0
    },
    events:{
      onReady:function(){
        playerReady = true;
        loadTrack(current,false);
        updatePlayingState();
        updateProgress();
      },
      onStateChange:function(event){
        updatePlayingState();

        if(event.data === YT.PlayerState.PLAYING){
          startProgressTimer();
        }else if(
          event.data === YT.PlayerState.PAUSED ||
          event.data === YT.PlayerState.ENDED ||
          event.data === YT.PlayerState.CUED
        ){
          stopProgressTimer();
          updateProgress();
        }

        if(event.data === YT.PlayerState.ENDED){
          loadTrack(current + 1,true);
        }
      },
      onError:function(){
        stopProgressTimer();
        nowArtist.textContent = "THIS VIDEO CANNOT BE PLAYED HERE";
        updatePlayingState();
      }
    }
  });
}

window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

const ytApi = document.createElement("script");
ytApi.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(ytApi);

loadTrack(0,false);
</script>
</body>
</html>
