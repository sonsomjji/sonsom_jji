<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Star Rain</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;

      font-family:
        Pretendard,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 전체 페이지 */
    .page {
      width: 100%;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* 맨 위 대문 이미지 */
    .hero {
      width: 100%;
      overflow: hidden;
      background: #000000;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;

      object-fit: cover;
      object-position: center;
      image-rendering: pixelated;
    }

    /* 이미지 아래 메인 안내 영역 */
    .main-entry {
      min-height: 480px;
      padding: 120px 24px 80px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      text-align: center;
    }

    .concept-text {
      color: #eeeeee;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.7;
      letter-spacing: -0.3px;
      word-break: keep-all;
    }

    /* 클릭 버튼 */
    .enter-button {
      width: min(100%, 280px);
      min-height: 72px;
      margin-top: 70px;
      padding: 18px 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #3e3e3e;
      border-radius: 5px;

      background: #1b1b1b;
      color: #f0f0f0;

      font-size: 14px;
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: -0.3px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .enter-button:hover {
      transform: translateY(-4px);

      border-color: #6925a8;
      background: #211726;

      box-shadow:
        0 0 18px rgba(105, 37, 168, 0.25);
    }

    .enter-button:active {
      transform: translateY(-1px);
    }

    /* 아래 캐릭터 영역 */
    .character-section {
      width: min(100% - 40px, 1000px);
      margin: 0 auto;
      padding-top: 80px;
    }

    .section-title {
      margin-bottom: 28px;

      color: #f2f2f2;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 38px;
    }

    .character-card {
      display: block;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .character-card:hover {
      transform: translateY(-8px);
    }

    .character-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;

      border: 1px solid #242424;
      border-radius: 4px;
      background: #111111;
    }

    .character-image img {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transition: transform 0.3s ease;
    }

    .character-card:hover .character-image img {
      transform: scale(1.04);
    }

    .character-name {
      margin-top: 11px;

      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .character-description {
      margin-top: 5px;

      color: #8f8f8f;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 모바일 */
    @media (max-width: 700px) {
      .hero-image {
        min-height: 240px;
        max-height: 320px;
        object-fit: cover;
      }

      .main-entry {
        min-height: 430px;
        padding: 100px 20px 70px;
      }

      .concept-text {
        font-size: 15px;
      }

      .enter-button {
        margin-top: 58px;
      }

      .character-grid {
        gap: 20px;
      }

      .character-name {
        font-size: 14px;
      }

      .character-description {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .hero-image {
        min-height: 190px;
        max-height: 230px;
      }

      .main-entry {
        min-height: 390px;
        padding-top: 85px;
      }

      .character-grid {
        grid-template-columns: 1fr;
        gap: 42px;
      }

      .character-name {
        font-size: 17px;
      }

      .character-description {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 맨 위 다크웹 대문 -->
    <header class="hero">
      <img
        class="hero-image"
        src="darkweb-main.png"
        alt="다크웹 스타일 메인 배너"
      >
    </header>

    <!-- 메인 입장 안내 -->
    <section class="main-entry">
      <p class="concept-text">
        다크웹스러운 콘셉트 대사<br>
        혹은 짧은 소개 문구
      </p>

      <!-- 클릭하면 캐릭터 목록으로 이동 -->
      <a class="enter-button" href="#characters">
        보라색 글씨 영역을<br>
        클릭 OK 정말 누를 거야?
      </a>
    </section>

    <!-- 캐릭터 목록 -->
    <section class="character-section" id="characters">
      <h2 class="section-title">Star Rain</h2>

      <div class="character-grid">

        <!-- 캐릭터 1 -->
        <a class="character-card" href="character1.html">
          <div class="character-image">
            <img
              src="character1.jpg"
              alt="캐릭터 1 프로필"
            >
          </div>

          <h3 class="character-name">캐릭터이름1</h3>

          <p class="character-description">
            캐릭터에 대한 짧은 설명
          </p>
        </a>

        <!-- 캐릭터 2 -->
        <a class="character-card" href="character2.html">
          <div class="character-image">
            <img
              src="character2.jpg"
              alt="캐릭터 2 프로필"
            >
          </div>

          <h3 class="character-name">캐릭터이름2</h3>

          <p class="character-description">
            캐릭터에 대한 짧은 설명
          </p>
        </a>

        <!-- 캐릭터 3 -->
        <a class="character-card" href="character3.html">
          <div class="character-image">
            <img
              src="character3.jpg"
              alt="캐릭터 3 프로필"
            >
          </div>

          <h3 class="character-name">캐릭터이름3</h3>

          <p class="character-description">
            캐릭터에 대한 짧은 설명
          </p>
        </a>

      </div>
    </section>

  </main>
</body>
</html>
