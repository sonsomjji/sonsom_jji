<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Star Rain</title>

  <!-- 터미널 느낌의 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      background: #000000;
      color: #ffffff;

      font-family:
        Pretendard,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 전체 페이지 */
    .page {
      width: 100%;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* 위쪽 다크웹 배너 */
    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000000;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;

      object-fit: cover;
      object-position: center;
      image-rendering: pixelated;
    }

    /* 배너 아래쪽에 자연스럽게 검정으로 연결 */
    .hero::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 80px;

      pointer-events: none;

      background: linear-gradient(
        to bottom,
        transparent,
        #000000
      );
    }

    /* 접속 안내 영역 */
    .main-entry {
      min-height: 500px;
      padding: 105px 24px 90px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      text-align: center;
    }

    /* 버튼 위 터미널 대사 */
    .concept-text {
      color: #c98dff;

      font-family:
        "Share Tech Mono",
        Consolas,
        monospace;

      font-size: 18px;
      font-weight: 400;
      line-height: 1.85;
      letter-spacing: 1px;

      text-shadow:
        0 0 5px rgba(179, 104, 255, 0.75),
        0 0 14px rgba(127, 47, 210, 0.35);
    }

    /* 터미널 버튼 */
    .enter-button {
      min-width: 245px;
      margin-top: 65px;
      padding: 18px 30px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #6f2ab3;
      border-radius: 3px;

      background: rgba(13, 9, 17, 0.96);
      color: #d39cff;

      font-family:
        "Share Tech Mono",
        Consolas,
        monospace;

      font-size: 18px;
      font-weight: 400;
      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        inset 0 0 14px rgba(120, 40, 255, 0.06),
        0 0 11px rgba(120, 40, 255, 0.18);

      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .enter-button:hover {
      color: #ffffff;
      border-color: #ba6cff;
      background: rgba(28, 15, 36, 0.98);

      box-shadow:
        inset 0 0 18px rgba(168, 73, 255, 0.08),
        0 0 8px rgba(157, 71, 255, 0.9),
        0 0 24px rgba(140, 60, 255, 0.4);

      transform: translateY(-3px);
    }

    .enter-button:active {
      transform: translateY(0);
    }

    /* 깜빡이는 커서 */
    .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    /* 캐릭터 목록 */
    .character-section {
      width: min(calc(100% - 40px), 1000px);
      margin: 0 auto;
      padding-top: 80px;
      scroll-margin-top: 40px;
    }

    .section-title {
      margin-bottom: 28px;

      color: #d5a4ff;

      font-family:
        "Share Tech Mono",
        Consolas,
        monospace;

      font-size: clamp(30px, 5vw, 46px);
      font-weight: 400;
      letter-spacing: 2px;

      text-shadow:
        0 0 10px rgba(140, 60, 255, 0.35);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 38px;
    }

    .character-card {
      display: block;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .character-card:hover {
      transform: translateY(-8px);
    }

    .character-card:active {
      transform: translateY(-2px);
    }

    .character-image {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;

      border: 1px solid #29202f;
      border-radius: 3px;

      background: #0e0e0e;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .character-card:hover .character-image {
      border-color: #7435a4;

      box-shadow:
        0 0 17px rgba(122, 44, 190, 0.25);
    }

    .character-image img {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      filter:
        saturate(0.9)
        contrast(1.05);

      transition:
        transform 0.3s ease,
        filter 0.3s ease;
    }

    .character-card:hover .character-image img {
      transform: scale(1.04);

      filter:
        saturate(1)
        contrast(1.08);
    }

    .character-name {
      margin-top: 11px;

      color: #ffffff;

      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .character-description {
      margin-top: 5px;

      color: #8f8f8f;

      font-size: 13px;
      line-height: 1.6;
    }

    /* 태블릿 */
    @media (max-width: 700px) {
      .hero-image {
        min-height: 240px;
        max-height: 320px;
        object-fit: cover;
      }

      .main-entry {
        min-height: 445px;
        padding: 90px 20px 70px;
      }

      .concept-text {
        font-size: 16px;
        letter-spacing: 0.7px;
      }

      .enter-button {
        min-width: 220px;
        margin-top: 55px;
        font-size: 17px;
      }

      .character-grid {
        gap: 20px;
      }

      .character-name {
        font-size: 14px;
      }

      .character-description {
        display: none;
      }
    }

    /* 모바일 */
    @media (max-width: 480px) {
      .hero-image {
        min-height: 190px;
        max-height: 230px;
        object-position: center;
      }

      .main-entry {
        min-height: 410px;
        padding: 80px 18px 65px;
      }

      .concept-text {
        font-size: 14px;
        line-height: 1.8;
      }

      .enter-button {
        min-width: 205px;
        margin-top: 48px;
        padding: 16px 22px;
        font-size: 16px;
      }

      .character-grid {
        grid-template-columns: 1fr;
        gap: 42px;
      }

      .character-name {
        font-size: 17px;
      }

      .character-description {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 맨 위 다크웹 메인 대문 -->
    <header class="hero">
      <img
        class="hero-image"
        src="darkweb-main.png"
        alt="다크웹 스타일 메인 배너"
      >
    </header>

    <!-- 접속 안내 -->
    <section class="main-entry">
      <p class="concept-text">
        Anonymous Route Established.<br><br>

        Connection encrypted.<br>
        Identity masked.<br>
        Awaiting authentication...
      </p>

      <!-- 클릭하면 캐릭터 목록으로 이동 -->
      <a class="enter-button" href="#characters">
        &gt; ENTER NODE<span class="cursor">_</span>
      </a>
    </section>


  </main>
</body>
</html>
