<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Star Rain</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 1000px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 26px 80px;
    }

    /* 상단 문구 박스 */
    .intro-box {
      min-height: 200px;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      color: #111111;
      border-radius: 5px;
      text-align: center;
    }

    .intro-box h1 {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      letter-spacing: -1.5px;
      word-break: keep-all;
    }

    /* 캐릭터 목록 */
    .character-area {
      margin-top: 250px;
    }

    .site-title {
      margin-bottom: 24px;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 38px;
    }

    /* 카드 전체가 클릭 영역 */
    .character-card {
      display: block;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .character-card:hover {
      transform: translateY(-8px);
    }

    .character-card:active {
      transform: translateY(-2px);
    }

    .character-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #ffffff;
      border-radius: 4px;
    }

    .character-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transition: transform 0.3s ease;
    }

    .character-card:hover .character-image img {
      transform: scale(1.04);
    }

    .character-name {
      margin-top: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .character-description {
      margin-top: 5px;
      color: #aaaaaa;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 모바일 */
    @media (max-width: 650px) {
      .page {
        padding: 18px 20px 60px;
      }

      .intro-box {
        min-height: 180px;
        padding: 28px 20px;
      }

      .character-area {
        margin-top: 220px;
      }

      .character-grid {
        gap: 20px;
      }

      .character-name {
        font-size: 14px;
      }

      .character-description {
        display: none;
      }
    }

    @media (max-width: 430px) {
      .character-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .character-image {
        aspect-ratio: 3 / 4;
      }

      .character-name {
        font-size: 17px;
      }

      .character-description {
        display: block;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 위쪽 문구 -->
    <section class="intro-box">
      <h1>밤하늘에 유성우 떨어지는 움짤</h1>
    </section>

    <!-- 캐릭터 선택 -->
    <section class="character-area">
      <h2 class="site-title">Star Rain</h2>

      <div class="character-grid">

        <!-- 캐릭터 1 -->
        <a class="character-card" href="character1.html">
          <div class="character-image">
            <img
              src="character1.jpg"
              alt="캐릭터이름1 프로필 사진"
            >
          </div>

          <h3 class="character-name">캐릭터이름1</h3>
          <p class="character-description">
            캐릭터에 대한 짧은 설명
          </p>
        </a>

        <!-- 캐릭터 2 -->
        <a class="character-card" href="character2.html">
          <div class="character-image">
            <img
              src="character2.jpg"
              alt="캐릭터이름2 프로필 사진"
            >
          </div>

          <h3 class="character-name">캐릭터이름2</h3>
          <p class="character-description">
            캐릭터에 대한 짧은 설명
          </p>
        </a>

        <!-- 캐릭터 3 -->
        <a class="character-card" href="character3.html">
          <div class="character-image">
            <img
              src="character3.jpg"
              alt="캐릭터이름3 프로필 사진"
            >
          </div>

          <h3 class="character-name">캐릭터이름3</h3>
          <p class="character-description">
            캐릭터에 대한 짧은 설명
          </p>
        </a>

      </div>
    </section>

  </main>
</body>
</html>
